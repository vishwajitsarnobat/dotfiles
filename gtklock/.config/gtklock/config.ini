# Lock screen: just the clock and date at rest. Any key shows the password
# field, and that key is already the first character typed into it.
# The background, style.css and layout.ui are passed in by ~/.local/bin/lockscreen.
[main]
gtk-theme=Adwaita-dark
time-format=%-I:%M %p
date-format=%A, %-d %B
start-hidden=true
idle-hide=true
idle-timeout=15
