[main]
font=Adwaita Sans:size=13,JetBrainsMono Nerd Font:size=13
terminal=alacritty -e
prompt="    "
placeholder=Search apps…
icons-enabled=no
width=36
lines=9
horizontal-pad=20
vertical-pad=18
inner-pad=12
line-height=20
match-counter=yes
# Open just under the bar, like a search box, instead of mid-screen
anchor=top
y-margin=44

[colors]
background=1e1e22fc
text=e3e3e8ff
prompt=8fb8f6ff
placeholder=6b6b76ff
input=f2f2f5ff
match=8fb8f6ff
selection=34343cff
selection-text=f2f2f5ff
selection-match=a9c9faff
border=8fb8f6ff

[border]
width=2
radius=12
selection-radius=8
