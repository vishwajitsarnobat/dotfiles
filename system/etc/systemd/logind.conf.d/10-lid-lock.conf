# Closing the lid only locks the screen: no suspend, no shutdown.
# Applies to every session (niri and GNOME). Install with:
#   sudo install -Dm644 system/etc/systemd/logind.conf.d/10-lid-lock.conf \
#       /etc/systemd/logind.conf.d/10-lid-lock.conf
#   sudo systemctl reload systemd-logind
[Login]
# On battery and on the charger
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
# With an external monitor connected: keep working on it
HandleLidSwitchDocked=ignore
